# Render Blueprint for Vazon: PostgreSQL, the API (Docker) and the frontend (static site).
# Render dashboard > New > Blueprint > this repository, Blueprint path: infra/render.yaml
#
# Values marked `sync: false` are asked for when the Blueprint is created and are
# never stored in git. Fill them in after the first deploy, once the URLs are known
# (see infra/README.md, "Deploying to Render").

databases:
  - name: vazon-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: vazon
    user: vazon

services:
  - type: web
    name: vazon-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vazon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # The frontend URL, for example https://vazon-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Google sign-in (optional). Callback: https://<api host>/api/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false

  - type: web
    name: vazon-web
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Single-page app: React Router handles every path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: NODE_VERSION
        value: "24.22.3"
      # The API URL, for example https://vazon-api.onrender.com/api/v1 (fixed at build time)
      - key: VITE_API_URL
        sync: false
