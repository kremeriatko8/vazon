name: Deploy to Render

# Deploys main to Render after CI has passed on it.
# Render is connected to the repository by URL, so it does not see new commits
# on its own; each service's Deploy Hook (Render > service > Settings > Deploy
# Hook) starts a deploy of the latest commit on main. The hook URLs are secrets:
#   RENDER_DEPLOY_HOOK_API  for vazon-api
#   RENDER_DEPLOY_HOOK_WEB  for vazon-web
# See infra/README.md, "Automatic deploys".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # Only after a successful CI run of a push to main (not a pull request), or by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Trigger Render deploys
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          WEB_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_API and RENDER_DEPLOY_HOOK_WEB repository secrets (see infra/README.md)."
            exit 1
          fi
          # The API first: it applies database migrations on start.
          curl --fail --silent --show-error --max-time 30 -X POST "$API_HOOK" > /dev/null
          echo "vazon-api deploy started"
          curl --fail --silent --show-error --max-time 30 -X POST "$WEB_HOOK" > /dev/null
          echo "vazon-web deploy started"
