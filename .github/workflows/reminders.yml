name: Reminders

# Every 30 minutes: wakes the API on Render (free plan sleeps when idle) and
# sends the daily reminder emails that are due. Free for public repositories.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   VAZON_API_URL  e.g. https://vazon-api.onrender.com
#   CRON_SECRET    the same value as CRON_SECRET on the vazon-api service
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          VAZON_API_URL: ${{ secrets.VAZON_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VAZON_API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "VAZON_API_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          # The first request may wake the service; give it time and retry.
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST "$VAZON_API_URL/api/v1/internal/reminders/run" \
            -H "x-cron-secret: $CRON_SECRET"
